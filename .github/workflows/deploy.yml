name: Deploy to Google Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  REPO_NAME: currify-repo
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: |-
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # ==========================================
      # 1. BUILD & PUSH: CURRIFY-CORE
      # ==========================================
      - name: Build Core
        run: docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-core:${{ github.sha }} ./currify-core
      - name: Push Core
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-core:${{ github.sha }}

      # ==========================================
      # 2. BUILD & PUSH: CURRIFY-BACK
      # ==========================================
      - name: Build Backend
        run: docker build -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }} ./currify-back
      - name: Push Backend
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }}

      # ==========================================
      # 3. BUILD & PUSH: CURRIFY-FRONT
      # ==========================================
      - name: Build Frontend
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }} \
            --build-arg REACT_APP_SCORING_SERVICE_URL=${{ secrets.REACT_APP_SCORING_SERVICE_URL }} \
            --build-arg REACT_APP_MAPBOX_TOKEN=${{ secrets.REACT_APP_MAPBOX_TOKEN }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-frontend:${{ github.sha }} ./currify-front
      - name: Push Frontend
        run: docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-frontend:${{ github.sha }}

      # ==========================================
      # 4. DEPLOY TO CLOUD RUN
      # ==========================================
      - name: Deploy Core
        run: |
          gcloud run deploy currify-core \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-core:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Deploy Backend
        run: |
          gcloud run deploy currify-backend \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --quiet

      - name: Deploy Frontend
        run: |
          gcloud run deploy currify-frontend \
            --image ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-frontend:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --quiet

      # ==========================================
      # 5. DATABASE MIGRATIONS (AUTO-RECOVERY)
      # ==========================================
      - name: Pull Backend Image
        run: docker pull ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }}

      - name: Check Migration Status
        id: migration_status
        run: |
          echo "Checking database migration status..."
          set +e
          docker run --rm \
            --entrypoint "/bin/sh" \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }} \
            -c "npx prisma migrate status 2>&1" | tee /tmp/migrate_status.log
          
          STATUS_EXIT_CODE=$?
          echo "Migration check exit code: $STATUS_EXIT_CODE"
          
          if grep -q "P3009\|P3018\|migration failed\|found failed migrations" /tmp/migrate_status.log; then
            echo "MIGRATION_STATUS=corrupted" >> $GITHUB_OUTPUT
            echo "Detected corrupted migrations. Will attempt recovery."
          elif [ $STATUS_EXIT_CODE -eq 0 ]; then
            echo "MIGRATION_STATUS=ok" >> $GITHUB_OUTPUT
            echo "Migrations are healthy."
          else
            echo "MIGRATION_STATUS=unknown" >> $GITHUB_OUTPUT
            echo "Migration status unknown, will attempt deploy."
          fi
          set -e

      - name: Reset Database if Corrupted
        if: steps.migration_status.outputs.MIGRATION_STATUS == 'corrupted'
        run: |
          echo "=========================================="
          echo "WARNING: Corrupted migrations detected!"
          echo "Resetting database to clean state..."
          echo "=========================================="
          docker run --rm \
            --entrypoint "/bin/sh" \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }} \
            -c "npx prisma migrate reset --force"

      - name: Run Prisma Migrate Deploy
        if: steps.migration_status.outputs.MIGRATION_STATUS != 'corrupted'
        run: |
          echo "Running migrations on production database..."
          docker run --rm \
            --entrypoint "/bin/sh" \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }} \
            -c "npx prisma migrate deploy"

      - name: Verify Migration Success
        run: |
          echo "Verifying migration status after deployment..."
          docker run --rm \
            --entrypoint "/bin/sh" \
            -e DATABASE_URL="${{ env.DATABASE_URL }}" \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/currify-backend:${{ github.sha }} \
            -c "npx prisma migrate status" || echo "Warning: Could not verify migration status"
