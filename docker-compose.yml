version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: currify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - currify-network

  currify-core:
    build:
      context: ./currify-core
      dockerfile: Dockerfile
    container_name: currify-core
    environment:
      # LLM Provider Configuration
      - LLM_PROVIDER=google
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Model Configuration
      - CLAUDE_MODEL=${CLAUDE_MODEL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_MODEL=gemini-2.0-flash
      - GROQ_MODEL=${GROQ_MODEL}
      # General LLM settings
      - MAX_TOKENS=${MAX_TOKENS}
      - TIMEOUT_SECONDS=${TIMEOUT_SECONDS}
      # Security
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VALID_API_KEYS=${VALID_API_KEYS}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
      # Environment
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
      - WATCHFILES_FORCE_POLLING=true
    ports:
      - "8001:8000"
    volumes:
      - ./currify-core:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - currify-network

  currify-backend:
    build:
      context: ./currify-back
      dockerfile: Dockerfile
    container_name: currify-backend
    volumes:
      - ./currify-back:/app
      - /app/node_modules
    entrypoint: [ "dumb-init", "--" ]
    command: npm run start:dev
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      # Google Auth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=http://localhost:3001/api/auth/google/callback
      # LinkedIn API (opcional)
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      # File Upload
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - UPLOAD_DEST=${UPLOAD_DEST}
      # AI Processing
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_URL=${AI_API_URL}
      # Scoring Service
      - SCORING_SERVICE_URL=http://currify-core:8000
      - SCORING_SERVICE_USERNAME=${SCORING_SERVICE_USERNAME}
      - SCORING_SERVICE_PASSWORD=${SCORING_SERVICE_PASSWORD}
      - SCORING_SERVICE_API_KEY=${SCORING_SERVICE_API_KEY}
      # Email Configuration
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      # Stripe
      - STRIPE_SECRET_KEY=dummy
      - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO}
    ports:
      - "3001:3001"

    depends_on:
      postgres:
        condition: service_healthy
      currify-core:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "healthcheck.js" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - currify-network

  currify-frontend:
    build:
      context: ./currify-front
      dockerfile: Dockerfile
      target: builder
      args:
        - REACT_APP_API_URL=/api
        - REACT_APP_SCORING_SERVICE_URL=${REACT_APP_SCORING_SERVICE_URL}
        - REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
    container_name: currify-frontend
    command: npm start
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_SCORING_SERVICE_URL=${REACT_APP_SCORING_SERVICE_URL}
      - REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
    ports:
      - "3000:3000"
    volumes:
      - ./currify-front:/app
      - /app/node_modules
    depends_on:
      - currify-backend
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - currify-network

volumes:
  postgres_data:


networks:
  currify-network:
    driver: bridge
