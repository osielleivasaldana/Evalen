version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: currify-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - currify-network

  currify-core:
    build:
      context: ./currify-core
      dockerfile: Dockerfile
    container_name: currify-core
    environment:
      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      # Model Configuration
      - CLAUDE_MODEL=${CLAUDE_MODEL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - GROQ_MODEL=${GROQ_MODEL}
      # General LLM settings
      - MAX_TOKENS=${MAX_TOKENS}
      - TIMEOUT_SECONDS=${TIMEOUT_SECONDS}
      # Security
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - VALID_API_KEYS=${VALID_API_KEYS}
      - API_SECRET_KEY=${API_SECRET_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      # Rate Limiting
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS}
      - RATE_LIMIT_WINDOW=${RATE_LIMIT_WINDOW}
      # Environment
      - ENVIRONMENT=${ENVIRONMENT}
      - DEBUG=${DEBUG}
    ports:
      - "8000:8000"
    volumes:
      - ./currify-core/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - currify-network

  currify-backend:
    build:
      context: ./currify-back
      dockerfile: Dockerfile
    container_name: currify-backend
    environment:
      # Database Configuration
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # JWT Configuration
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      # LinkedIn API (opcional)
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      # File Upload
      - MAX_FILE_SIZE=${MAX_FILE_SIZE}
      - UPLOAD_DEST=${UPLOAD_DEST}
      # AI Processing
      - AI_API_KEY=${AI_API_KEY}
      - AI_API_URL=${AI_API_URL}
      # Scoring Service
      - SCORING_SERVICE_URL=http://currify-core:8000
      - SCORING_SERVICE_USERNAME=${SCORING_SERVICE_USERNAME}
      - SCORING_SERVICE_PASSWORD=${SCORING_SERVICE_PASSWORD}
      - SCORING_SERVICE_API_KEY=${SCORING_SERVICE_API_KEY}
    ports:
      - "3001:3001"
    volumes:
      - ./currify-back/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      currify-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - currify-network

  currify-frontend:
    build:
      context: ./currify-front
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL}
        - REACT_APP_SCORING_SERVICE_URL=${REACT_APP_SCORING_SERVICE_URL}
        - REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
    container_name: currify-frontend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
      - REACT_APP_SCORING_SERVICE_URL=${REACT_APP_SCORING_SERVICE_URL}
      - REACT_APP_MAPBOX_TOKEN=${REACT_APP_MAPBOX_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      - currify-backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - currify-network

volumes:
  postgres_data:

networks:
  currify-network:
    driver: bridge